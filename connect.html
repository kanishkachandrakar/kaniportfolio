  <script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxptlQB673K5Zj1cZU8GX2b_nqHctjAFgTgfP1xeSrhKJz8q4wmpk1sY_s8Eh-CJand/exec';
  const form = document.getElementById('contact-form'); // use ID
  const msg = document.getElementById("msg");

  console.log("SCRIPT LOADED ✅", { formFound: !!form });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    msg.textContent = "Sending...";

    fetch(scriptURL, {
      method: 'POST',
      mode: 'no-cors',          // IMPORTANT for Google Apps Script
      body: new FormData(form)
    })
    .then(() => {
      msg.innerHTML = '<i class="fa-solid fa-circle-check"></i> Message received!';

      form.reset();
      setTimeout(() => msg.textContent = "", 5000);
    })
    .catch(err => {
      console.error("Submit failed:", err);
      msg.textContent = "Failed to send. Please try again.";
    });
  });
</script>
